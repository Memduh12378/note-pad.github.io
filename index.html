<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>NotePad - Otomatik Not Defteri</title>
  <link rel="icon" type="image/png" href="notesbook.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&amp;display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
  <!-- Ekranın Soluna Yapışık Menü Panel -->
  <aside class="sidebar">
    <div class="sidebar-header">Kaydedilen Notlar</div>
    
    <!-- Başlangıçta Boş Olan Liste Bölgesi -->
    <div class="notes-list" id="notesList"></div>

    <!-- Alt Kısımdaki Yeni Not Oluştur Butonu -->
    <button class="new-note-btn" id="newNoteBtn">+ Yeni Not Oluştur</button>
  </aside>

  <!-- Ana Editör Bölgesi -->
  <main class="editor-container">
    <h1 class="app-title">📝 Not Defteri</h1>

    <div class="editor-box">
      <input type="text" id="noteTitleInput" placeholder="Notunuza Bir İsim Verin..." />
      <textarea id="noteContentInput" placeholder="Yazmaya başla..."></textarea>
    </div>

    <!-- Alt Buton Grubu -->
    <div class="action-buttons">
      <button id="saveNoteBtn" class="action-btn">NOTU KAYDET</button>
      <button id="saveAsNewBtn" class="action-btn">YENİ NOT OLARAK KAYDET</button>
    </div>
  </main>
</div>
  <script src="script.js"></script>
</body>
</html>
